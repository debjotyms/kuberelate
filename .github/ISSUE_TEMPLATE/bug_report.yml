name: Bug report
description: Report a reproducible problem using synthetic, non-sensitive data.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never attach credentials, kubeconfigs, production manifests, or unredacted Secret values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and synthetic YAML when relevant.
      placeholder: |
        1. Open ...
        2. Paste the synthetic example ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: main or a commit SHA
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 16
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add synthetic screenshots, logs, or accessibility details when useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private manifests, and Secret values from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
